[pytest]
# Coverage thresholds are NOT enforced here. With branch coverage enabled,
# coverage.py's `fail_under` applies to a single *combined* statement+branch
# score, which is neither of the two numbers we actually gate on. Statement
# and branch thresholds are asserted separately by
# `scripts/agentic-ci/coverage-gate.py`, which reads coverage.json.
addopts = --cov=backend --cov-branch --cov-report=term-missing --cov-report=json:coverage.json
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: DB or external system tests
    slow: Tests that take >1s or require full app startup
