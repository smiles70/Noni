name: Configure Railway for mynaani.com

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Find noni-api production Railway domain
        id: domain
        run: |
          set -e
          railway environment list --json > envs.json
          cat envs.json
          ENV_NAME=$(jq -r '.[] | select(.name != "staging") | .name' envs.json | head -1)
          if [ -z "$ENV_NAME" ]; then
            ENV_NAME=$(jq -r '.[0].name' envs.json)
          fi
          echo "Using environment: $ENV_NAME"
          railway domain list --service noni-api --environment "$ENV_NAME" --json > domains.json
          cat domains.json
          URL=$(jq -r '.[0].domain' domains.json)
          if [ -z "$URL" ]; then
            echo "No Railway domain found for noni-api"; exit 1
          fi
          if [[ "$URL" != https://* ]]; then URL="https://$URL"; fi
          echo "railway_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Set GitHub variables
        run: |
          gh variable set VITE_API_BASE_URL --body "${{ steps.domain.outputs.railway_url }}"
          gh variable set PROD_API_BASE_URL --body "${{ steps.domain.outputs.railway_url }}"

      - name: Redeploy
        run: gh workflow run deploy.yml --ref main
