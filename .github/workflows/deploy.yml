name: Deploy

# Production deploy pipeline. Skips with a notice if required secrets are
# not yet present (so CI doesn't fail before Phase B onboarding).
#
# Triggers:
#   - push to main (after CI green)
#   - manual workflow_dispatch

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      cloudflare_ready: ${{ steps.check.outputs.cloudflare_ready }}
      railway_ready: ${{ steps.check.outputs.railway_ready }}
      have_supabase: ${{ steps.check.outputs.have_supabase }}
    steps:
      - name: Check whether deploy secrets are present
        id: check
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          # Cloudflare Pages only needs Cloudflare secrets.
          # Railway backend only needs RAILWAY_TOKEN.
          cloudflare_missing=()
          for k in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!k}" ]]; then cloudflare_missing+=("$k"); fi
          done
          if [[ ${#cloudflare_missing[@]} -gt 0 ]]; then
            echo "::notice::Cloudflare deploy skipped — missing: ${cloudflare_missing[*]}"
            echo "cloudflare_ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "cloudflare_ready=true" >> "$GITHUB_OUTPUT"
          fi

          if [[ -z "$RAILWAY_TOKEN" ]]; then
            echo "::notice::Railway deploy skipped — missing: RAILWAY_TOKEN"
            echo "railway_ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "railway_ready=true" >> "$GITHUB_OUTPUT"
          fi
          # Optional Supabase migration step. Skipped when DB is Railway Postgres.
          if [[ -n "$SUPABASE_ACCESS_TOKEN" && -n "$SUPABASE_PROJECT_REF" ]]; then
            echo "have_supabase=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_supabase=false" >> "$GITHUB_OUTPUT"
          fi

  supabase-db-push:
    needs: preflight
    # Only runs when both Supabase secrets are configured (signalled by
    # preflight.have_supabase). When the database is Railway Postgres (or
    # any non-Supabase Postgres) this job is skipped; Alembic owns the
    # schema and applies on backend boot via the FastAPI lifespan in
    # backend/app/main.py.
    if: needs.preflight.outputs.railway_ready == 'true' && needs.preflight.outputs.have_supabase == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: supabase db push
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --include-all

  railway-deploy-backend:
    # `needs` ensures preflight passed; we don't gate on supabase-db-push
    # because that job is conditionally skipped in non-Supabase deploys.
    # GitHub treats skipped dependencies as "passed" only with `always()`
    # or by listing them but not blocking on their result — using
    # `if: success() || needs.supabase-db-push.result == 'skipped'`.
    needs: [preflight, supabase-db-push]
    if: (success() || needs.supabase-db-push.result == 'skipped') && needs.preflight.outputs.railway_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # DEPLOY-ENV-SYNC-001: `railway up` without --environment deploys to the
    # token's *default* environment — that silently sent every production
    # deploy to staging. Pin the environment AND bind the job to the
    # GitHub `production` environment so protection rules apply.
    environment: production
    env:
      # Railway project tokens are ENVIRONMENT-SCOPED: the shared
      # RAILWAY_TOKEN can only see `staging` ("Environment not found" on
      # production). The `production` GitHub environment must carry its own
      # token (secrets.RAILWAY_TOKEN set at the environment level).
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: noni-api
      DEPLOY_ENVIRONMENT: production
      API_URL: https://noni-api-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy backend to Railway production
        run: railway up -y --detach --service "$RAILWAY_SERVICE" --environment "$DEPLOY_ENVIRONMENT"
      - name: Verify deployment reached the right environment
        run: |
          # Post-deploy verification: a deploy is not done when `railway up`
          # returns 0 — it is done when the target env serves the new surface.
          # Poll until /health reports the right environment AND the route
          # surface contains a sentinel path from this build.
          for i in $(seq 1 40); do
            env_name=$(curl -sf "$API_URL/health" | python3 -c "import json,sys; print(json.load(sys.stdin).get('environment',''))" 2>/dev/null || echo "")
            sentinel=$(curl -sf "$API_URL/openapi.json" | python3 -c "import json,sys; print('/api/v1/admin/whoami-check' in json.load(sys.stdin)['paths'])" 2>/dev/null || echo "False")
            echo "attempt $i: environment=$env_name sentinel=$sentinel"
            if [ "$env_name" = "$DEPLOY_ENVIRONMENT" ] && [ "$sentinel" = "True" ]; then
              echo "VERIFIED: $DEPLOY_ENVIRONMENT serving new build"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Deployment verification FAILED — $API_URL did not converge to $DEPLOY_ENVIRONMENT with the new route surface within 10 minutes"
          exit 1

  cloudflare-pages-deploy:
    needs: [preflight]  # DECOUPLED: backend already deployed
    if: needs.preflight.outputs.cloudflare_ready == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT || 'noni-web' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Verify build environment
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://noni-api-production.up.railway.app' }}
          # ADR 0027: mock is the safe default for CI builds.
          VITE_AUTH_PROVIDER: 'mock'
          VITE_MAGIC_PUBLISHABLE_KEY: ''
          VITE_RETELL_PUBLIC_KEY: 'public_key_c2dfb899128b3a172cc17'
          VITE_RETELL_CHAT_AGENT_ID_GIFT: 'agent_646dba13a4321b698970c15c68'
          VITE_RETELL_CHAT_AGENT_ID_FACILITY: 'agent_719be4f2578150bb27ac06f357'
          CI: true
          NODE_ENV: production
        run: npm run prebuild

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://noni-api-production.up.railway.app' }}
          # ADR 0027: mock is the safe default for CI builds.
          VITE_AUTH_PROVIDER: 'mock'
          VITE_MAGIC_PUBLISHABLE_KEY: ''
          VITE_RETELL_PUBLIC_KEY: 'public_key_c2dfb899128b3a172cc17'
          VITE_RETELL_CHAT_AGENT_ID_GIFT: 'agent_646dba13a4321b698970c15c68'
          VITE_RETELL_CHAT_AGENT_ID_FACILITY: 'agent_719be4f2578150bb27ac06f357'
          CI: true
          NODE_ENV: production
        run: npm run build

      - name: Verify bundle (G3 guard)
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://noni-api-production.up.railway.app' }}
        run: npm run postbuild
      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: noni-web
          directory: frontend/dist
          branch: main

  smoke:
    needs: [preflight, railway-deploy-backend, cloudflare-pages-deploy]
    if: needs.preflight.outputs.railway_ready == 'true' && needs.preflight.outputs.cloudflare_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke-test production endpoints
        env:
          PROD_API_BASE_URL: ${{ vars.PROD_API_BASE_URL || 'https://noni-api-production.up.railway.app' }}
        run: bash infra/scripts/smoke-prod.sh
