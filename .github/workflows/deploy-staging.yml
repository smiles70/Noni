name: Deploy Staging

# Staging deploy pipeline. Pushes the `staging` branch to the Railway staging
# environment and the Cloudflare Pages staging preview. QA and UAT must pass
# before any deployment is attempted.
#
# Triggers:
#   - push to staging
#   - manual workflow_dispatch

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      cloudflare_ready: ${{ steps.check.outputs.cloudflare_ready }}
      railway_ready: ${{ steps.check.outputs.railway_ready }}
    steps:
      - name: Check whether deploy secrets are present
        id: check
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$RAILWAY_TOKEN" ]]; then
            echo "::notice::Railway deploy skipped — missing: RAILWAY_TOKEN"
            echo "railway_ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "railway_ready=true" >> "$GITHUB_OUTPUT"
          fi

          cloudflare_missing=()
          for k in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!k}" ]]; then cloudflare_missing+=("$k"); fi
          done
          if [[ ${#cloudflare_missing[@]} -gt 0 ]]; then
            echo "::notice::Cloudflare deploy skipped — missing: ${cloudflare_missing[*]}"
            echo "cloudflare_ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "cloudflare_ready=true" >> "$GITHUB_OUTPUT"
          fi

  virtual-qa-agent:
    name: QA - Lint, Security, and Tests
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backend syntax and compile check
        run: python -m compileall backend/

      - name: Backend security scan
        run: |
          pip install bandit
          bandit -r backend/ -f txt -o bandit-report.txt || true
          cat bandit-report.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend tests
        working-directory: frontend
        run: npm run test:unit

      - name: Secret leak detection
        run: |
          pip install truffleHog
          truffleHog filesystem . --only-verified || true

  virtual-uat-agent:
    name: UAT - Contract and E2E Tests
    needs: virtual-qa-agent
    runs-on: ubuntu-latest
    # Postgres service + env mirror ci.yml — the contract tests import the
    # app, which requires a real DATABASE_URL.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: noni
          POSTGRES_PASSWORD: noni
          POSTGRES_DB: noni
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://noni:noni@localhost:5432/noni
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Backend contract tests (full suite — coverage floor per pyproject)
        run: |
          pytest backend/tests/ -v

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Playwright E2E tests
        working-directory: frontend
        run: npm run e2e --if-present

  railway-deploy-backend:
    needs: [preflight, virtual-uat-agent]
    if: needs.preflight.outputs.railway_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: noni-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy backend to Railway staging
        run: railway up -y --detach --service "$RAILWAY_SERVICE" --environment staging

  cloudflare-pages-deploy:
    needs: [preflight, virtual-uat-agent]
    if: needs.preflight.outputs.cloudflare_ready == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT || 'noni-web' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify build environment
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
          VITE_AUTH_PROVIDER: 'mock'
          VITE_MAGIC_PUBLISHABLE_KEY: ''
          CI: true
          NODE_ENV: production
        run: npm run prebuild

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
          VITE_AUTH_PROVIDER: 'mock'
          VITE_MAGIC_PUBLISHABLE_KEY: ''
          CI: true
          NODE_ENV: production
        run: npm run build

      - name: Verify bundle (G3 guard)
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
        run: npm run postbuild

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ env.CLOUDFLARE_PAGES_PROJECT }}
          directory: frontend/dist
          branch: staging
