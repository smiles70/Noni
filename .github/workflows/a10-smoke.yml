name: Backend A10 isolated smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - staging
    paths:
      - 'backend/**'
      - '.github/workflows/a10-smoke.yml'
      - 'pyproject.toml'

jobs:
  a10-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        env:
          PIP_NO_CACHE_DIR: '1'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[dev]'

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          cd /home/runner/work/Noni/Noni || cd .
          python -m alembic upgrade head

      - name: A10 isolated smoke
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          python -m pytest backend/tests/test_a10_smoke.py -v
